<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses | QuizRank</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body class="bg-slate-50 text-slate-800">


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="bg-white border-b border-slate-200">

        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

            <!-- Logo -->

            <a
                href="dashboard.html"
                class="text-xl font-bold text-slate-900">

                Quiz<span class="text-indigo-600">Rank</span>

            </a>


            <!-- Navigation -->

            <div class="flex items-center gap-6">

                <a
                    href="my-course.html"
                    class="flex items-center gap-2 text-sm font-medium text-indigo-600">

                    <i
                        data-lucide="book-open"
                        class="w-4 h-4">
                    </i>

                    My Course

                </a>


                <a
                    href="notice.html"
                    class="flex items-center gap-2 text-sm text-slate-600 hover:text-indigo-600">

                    <i
                        data-lucide="bell"
                        class="w-4 h-4">
                    </i>

                    Notice

                </a>


                <a
                    href="../leaderboard.html"
                    class="flex items-center gap-2 text-sm text-slate-600 hover:text-indigo-600">

                    <i
                        data-lucide="trophy"
                        class="w-4 h-4">
                    </i>

                    Leaderboard

                </a>


                <a
                    href="profile.html"
                    class="flex items-center gap-2 text-sm text-slate-600 hover:text-indigo-600">

                    <i
                        data-lucide="user"
                        class="w-4 h-4">
                    </i>

                    Profile

                </a>


                <button
                    onclick="logout()"
                    class="flex items-center gap-2 text-sm text-red-500 hover:text-red-600">

                    <i
                        data-lucide="log-out"
                        class="w-4 h-4">
                    </i>

                    Logout

                </button>

            </div>

        </div>

    </nav>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="max-w-7xl mx-auto px-6 py-8">


        <!-- Page Header -->

        <div class="flex items-center justify-between mb-6">

            <div>

                <h1 class="text-2xl font-bold text-slate-900">
                    My Courses
                </h1>

                <p class="text-sm text-slate-500 mt-1">
                    Your course performance
                </p>

            </div>


            <div
                class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center">

                <i
                    data-lucide="book-open"
                    class="w-5 h-5 text-indigo-600">
                </i>

            </div>

        </div>



        <!-- =========================
             COURSE TABLE
        ========================== -->

        <div
            class="bg-white border border-slate-200 rounded-xl overflow-hidden">

            <div class="overflow-x-auto">

                <table class="w-full">

                    <!-- Table Header -->

                    <thead>

                        <tr class="bg-slate-900 text-white">

                            <th
                                class="px-6 py-4 text-left text-sm font-semibold w-20">

                                #

                            </th>


                            <th
                                class="px-6 py-4 text-left text-sm font-semibold">

                                Course Name

                            </th>


                            <th
                                class="px-6 py-4 text-center text-sm font-semibold w-48">

                                Total Quizzes

                            </th>


                            <th
                                class="px-6 py-4 text-center text-sm font-semibold w-48">

                                Avg Mark

                            </th>

                        </tr>

                    </thead>


                    <!-- Table Body -->

                    <tbody
                        id="courseTableBody"
                        class="divide-y divide-slate-200">

                        <tr>

                            <td
                                colspan="4"
                                class="px-6 py-12 text-center text-slate-400">

                                Loading courses...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // Lucide icons
        lucide.createIcons();


        // =========================
        // LOAD COURSES
        // =========================

        async function loadCourses() {

            const tableBody =
                document.getElementById(
                    "courseTableBody"
                );


            try {

                const response =
                    await fetch("../courses");


                // Session expired

                if (response.status === 401) {

                    localStorage.removeItem("user");

                    window.location.href =
                        "../index.html";

                    return;
                }


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        "Unable to load courses"
                    );

                }


                // No courses

                if (
                    !data.courses ||
                    data.courses.length === 0
                ) {

                    tableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="4"
                                class="px-6 py-12 text-center text-slate-400">

                                No courses found.

                            </td>

                        </tr>

                    `;

                    return;
                }


                // Courses

                tableBody.innerHTML =
                    data.courses.map(
                        (course, index) => `

                    <tr
                        class="hover:bg-slate-50 transition">

                        <!-- Number -->

                        <td
                            class="px-6 py-4 text-sm text-slate-600">

                            ${index + 1}

                        </td>


                        <!-- Course Name -->

                        <td
                            class="px-6 py-4 text-sm font-medium text-slate-800">

                            ${course.courseTitle}

                        </td>


                        <!-- Total Quizzes -->

                        <td
                            class="px-6 py-4 text-center text-sm font-medium text-slate-700">

                            ${course.totalQuizzes}

                        </td>


                        <!-- Average Mark -->

                        <td
                            class="px-6 py-4 text-center">

                            <span
                                class="inline-flex items-center justify-center
                                min-w-20 px-3 py-1.5 rounded-lg
                                bg-indigo-50
                                text-indigo-600
                                text-sm font-semibold">

                                ${Number(course.averageMark).toFixed(2)}%

                            </span>

                        </td>

                    </tr>

                `
                    ).join("");


            } catch (error) {

                console.error(
                    "Course loading error:",
                    error
                );


                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="4"
                            class="px-6 py-12 text-center text-red-500">

                            Failed to load courses.

                        </td>

                    </tr>

                `;

            }

        }



        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem("user");

            fetch("../logout", {
                method: "POST"
            })
            .finally(() => {

                window.location.href =
                    "../index.html";

            });

        }


        // Load courses
        loadCourses();

    </script>

</body>

</html>
