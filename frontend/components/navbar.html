<script>

    /*
     * Determine whether current page is inside
     * Student or teacher folder.
     */

    const currentPath = window.location.pathname;

    const isStudent =
        currentPath.includes("/Student/");

    const isTeacher =
        currentPath.includes("/teacher/");


    /*
     * Base paths
     */

    let homePath;
    let coursePath;
    let noticePath;
    let profilePath;


    if (isStudent) {

        homePath =
            "/QuizRank/Student/dashboard.html";

        coursePath =
            "/QuizRank/Student/my-course.html";

        noticePath =
            "/QuizRank/Student/notice.html";

        profilePath =
            "/QuizRank/Student/profile.html";

    }

    else if (isTeacher) {

        homePath =
            "/QuizRank/teacher/dashboard.html";

        coursePath =
            "/QuizRank/teacher/my-course.html";

        noticePath =
            "/QuizRank/teacher/notice.html";

        profilePath =
            "/QuizRank/teacher/profile.html";

    }

    else {

        homePath =
            "/QuizRank/index.html";

        coursePath =
            "#";

        noticePath =
            "#";

        profilePath =
            "#";

    }


    const leaderboardPath =
        "/QuizRank/leaderboard.html";


    /*
     * Desktop links
     */

    document.getElementById("logoLink").href =
        homePath;

    document.getElementById("homeLink").href =
        homePath;

    document.getElementById("courseLink").href =
        coursePath;

    document.getElementById("noticeLink").href =
        noticePath;

    document.getElementById("leaderboardLink").href =
        leaderboardPath;

    document.getElementById("profileLink").href =
        profilePath;


    /*
     * Mobile links
     */

    document.getElementById("mobileHomeLink").href =
        homePath;

    document.getElementById("mobileCourseLink").href =
        coursePath;

    document.getElementById("mobileNoticeLink").href =
        noticePath;

    document.getElementById("mobileLeaderboardLink").href =
        leaderboardPath;

    document.getElementById("mobileProfileLink").href =
        profilePath;


    /*
     * Mobile menu
     */

    const menuBtn =
        document.getElementById("menuBtn");

    const mobileMenu =
        document.getElementById("mobileMenu");


    menuBtn.addEventListener("click", () => {

        mobileMenu.classList.toggle("hidden");

    });


    /*
     * Logout
     */

    async function logoutUser() {

        try {

            await fetch("/QuizRank/logout", {
                method: "GET"
            });

        } catch (error) {

            console.log("Logout request failed:", error);

        }


        localStorage.removeItem("user");

        window.location.href =
            "/QuizRank/index.html";

    }


    document.getElementById("logoutBtn")
        .addEventListener(
            "click",
            logoutUser
        );


    document.getElementById("mobileLogoutBtn")
        .addEventListener(
            "click",
            logoutUser
        );


    /*
     * Highlight current page
     */

    const currentPage =
        window.location.pathname;


    document.querySelectorAll(".nav-link")
        .forEach(link => {

            if (
                link.getAttribute("href") ===
                currentPage
            ) {

                link.classList.remove(
                    "text-slate-600"
                );

                link.classList.add(
                    "text-indigo-600",
                    "font-semibold"
                );

            }

        });


    /*
     * Lucide icons
     */

    if (typeof lucide !== "undefined") {

        lucide.createIcons();

    }

</script>
