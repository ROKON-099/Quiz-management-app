<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Quiz - QuizRank</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body class="bg-slate-50 min-h-screen">


<!-- ================= NAVBAR ================= -->

<nav class="bg-white border-b border-slate-200">

    <div class="max-w-7xl mx-auto px-4">

        <div class="h-16 flex items-center justify-between">

            <a href="dashboard.html"
               class="text-xl font-bold text-indigo-600">

                QuizRank

            </a>

            <a href="dashboard.html"
               class="text-sm text-slate-600 hover:text-indigo-600">

                Dashboard

            </a>

        </div>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<main class="max-w-5xl mx-auto px-4 py-8">


    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-900">
            Create Quiz
        </h1>

        <p class="text-slate-500 mt-2">
            Create a 10-question quiz for your assigned course.
        </p>

    </div>


    <!-- ================= FORM ================= -->

    <form id="quizForm"
          class="space-y-6">


        <!-- QUIZ INFORMATION -->

        <div class="bg-white
                    border border-slate-200
                    rounded-2xl
                    p-6">

            <h2 class="text-lg font-semibold text-slate-900 mb-5">
                Quiz Information
            </h2>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                <!-- SUBJECT -->

                <div>

                    <label
                        class="block text-sm font-medium
                               text-slate-700 mb-2">

                        Select Course

                    </label>


                    <select
                        id="subjectId"
                        name="subjectId"
                        required
                        class="w-full px-4 py-3
                               rounded-xl
                               border border-slate-300
                               bg-white
                               text-slate-800
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                        <option value="">
                            Loading your courses...
                        </option>

                    </select>

                </div>


                <!-- TOPIC -->

                <div>

                    <label
                        class="block text-sm font-medium
                               text-slate-700 mb-2">

                        Quiz Topic

                    </label>


                    <input
                        type="text"
                        id="topic"
                        name="topic"
                        required
                        placeholder="Example: Array"
                        class="w-full px-4 py-3
                               rounded-xl
                               border border-slate-300
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                </div>


                <!-- DATE -->

                <div>

                    <label
                        class="block text-sm font-medium
                               text-slate-700 mb-2">

                        Quiz Date

                    </label>


                    <input
                        type="date"
                        id="quizDate"
                        name="quizDate"
                        required
                        class="w-full px-4 py-3
                               rounded-xl
                               border border-slate-300
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                </div>


                <!-- TIME -->

                <div>

                    <label
                        class="block text-sm font-medium
                               text-slate-700 mb-2">

                        Quiz Time

                    </label>


                    <input
                        type="time"
                        id="quizTime"
                        name="quizTime"
                        required
                        class="w-full px-4 py-3
                               rounded-xl
                               border border-slate-300
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                </div>

            </div>

        </div>


        <!-- ================= QUESTIONS ================= -->

        <div id="questionsContainer"
             class="space-y-6">

        </div>


        <!-- ================= SUBMIT ================= -->

        <div class="bg-white
                    border border-slate-200
                    rounded-2xl
                    p-6">

            <button
                type="submit"
                id="createQuizButton"
                class="inline-flex
                       items-center
                       gap-2
                       px-6 py-3
                       rounded-xl
                       bg-indigo-600
                       hover:bg-indigo-700
                       text-white
                       font-medium
                       transition">

                <i data-lucide="plus-circle"
                   class="w-5 h-5">
                </i>

                Create Quiz

            </button>


            <p id="message"
               class="mt-4 text-sm">
            </p>

        </div>

    </form>

</main>


<script>


/* ==========================================
   CREATE 10 QUESTIONS
========================================== */

const questionsContainer =
    document.getElementById(
        "questionsContainer"
    );


for (let i = 1; i <= 10; i++) {

    questionsContainer.innerHTML += `

        <div class="bg-white
                    border border-slate-200
                    rounded-2xl
                    p-6">

            <div class="flex items-center
                        justify-between mb-5">

                <h2 class="text-lg
                           font-semibold
                           text-slate-900">

                    Question ${i}

                </h2>

                <span class="text-xs
                             font-medium
                             text-indigo-600
                             bg-indigo-50
                             px-3 py-1
                             rounded-full">

                    30 Seconds

                </span>

            </div>


            <!-- QUESTION -->

            <div class="mb-5">

                <label class="block
                              text-sm
                              font-medium
                              text-slate-700
                              mb-2">

                    Question

                </label>

                <textarea
                    name="question_${i}"
                    required
                    rows="3"
                    placeholder="Write question ${i}"
                    class="w-full
                           px-4 py-3
                           rounded-xl
                           border border-slate-300
                           resize-none
                           focus:outline-none
                           focus:ring-2
                           focus:ring-indigo-500"></textarea>

            </div>


            <!-- OPTIONS -->

            <div class="grid grid-cols-1
                        md:grid-cols-2
                        gap-4">


                <div>

                    <label class="block
                                  text-sm
                                  font-medium
                                  text-slate-700
                                  mb-2">

                        Option A

                    </label>

                    <input
                        type="text"
                        name="option_a_${i}"
                        required
                        placeholder="Option A"
                        class="w-full
                               px-4 py-3
                               rounded-xl
                               border border-slate-300
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                </div>


                <div>

                    <label class="block
                                  text-sm
                                  font-medium
                                  text-slate-700
                                  mb-2">

                        Option B

                    </label>

                    <input
                        type="text"
                        name="option_b_${i}"
                        required
                        placeholder="Option B"
                        class="w-full
                               px-4 py-3
                               rounded-xl
                               border border-slate-300
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                </div>


                <div>

                    <label class="block
                                  text-sm
                                  font-medium
                                  text-slate-700
                                  mb-2">

                        Option C

                    </label>

                    <input
                        type="text"
                        name="option_c_${i}"
                        required
                        placeholder="Option C"
                        class="w-full
                               px-4 py-3
                               rounded-xl
                               border border-slate-300
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                </div>


                <div>

                    <label class="block
                                  text-sm
                                  font-medium
                                  text-slate-700
                                  mb-2">

                        Option D

                    </label>

                    <input
                        type="text"
                        name="option_d_${i}"
                        required
                        placeholder="Option D"
                        class="w-full
                               px-4 py-3
                               rounded-xl
                               border border-slate-300
                               focus:outline-none
                               focus:ring-2
                               focus:ring-indigo-500">

                </div>

            </div>


            <!-- CORRECT ANSWER -->

            <div class="mt-5">

                <label class="block
                              text-sm
                              font-medium
                              text-slate-700
                              mb-2">

                    Correct Answer

                </label>


                <select
                    name="correct_answer_${i}"
                    required
                    class="w-full
                           px-4 py-3
                           rounded-xl
                           border border-slate-300
                           bg-white
                           focus:outline-none
                           focus:ring-2
                           focus:ring-indigo-500">

                    <option value="">
                        Select correct answer
                    </option>

                    <option value="A">
                        Option A
                    </option>

                    <option value="B">
                        Option B
                    </option>

                    <option value="C">
                        Option C
                    </option>

                    <option value="D">
                        Option D
                    </option>

                </select>

            </div>

        </div>

    `;
}


lucide.createIcons();


/* ==========================================
   LOAD TEACHER COURSES
========================================== */

async function loadTeacherCourses() {

    const select =
        document.getElementById(
            "subjectId"
        );


    try {

        const response =
            await fetch(
                "/QuizRank/teacher-courses",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        const data =
            await response.json();


        console.log(
            "Teacher courses:",
            data
        );


        if (!response.ok ||
            !data.success) {

            select.innerHTML = `
                <option value="">
                    Unable to load courses
                </option>
            `;

            return;
        }


        if (!data.courses ||
            data.courses.length === 0) {

            select.innerHTML = `
                <option value="">
                    No courses assigned
                </option>
            `;

            return;
        }


        select.innerHTML = `
            <option value="">
                Select a course
            </option>
        `;


        data.courses.forEach(course => {

            const option =
                document.createElement("option");


            option.value =
                course.id;


            option.textContent =
                course.name;


            select.appendChild(
                option
            );

        });


    } catch (error) {

        console.error(error);


        select.innerHTML = `
            <option value="">
                Failed to load courses
            </option>
        `;
    }
}


loadTeacherCourses();


/* ==========================================
   CREATE QUIZ
========================================== */

document.getElementById(
    "quizForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const button =
            document.getElementById(
                "createQuizButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const subjectId =
            document.getElementById(
                "subjectId"
            ).value;


        const topic =
            document.getElementById(
                "topic"
            ).value.trim();


        const quizDate =
            document.getElementById(
                "quizDate"
            ).value;


        const quizTime =
            document.getElementById(
                "quizTime"
            ).value;


        if (!subjectId) {

            message.textContent =
                "Please select a course.";

            message.className =
                "mt-4 text-sm text-red-600";

            return;
        }


        /*
         * Build form data
         */

        const formData =
            new URLSearchParams();


        formData.append(
            "subjectId",
            subjectId
        );


        formData.append(
            "topic",
            topic
        );


        formData.append(
            "quizDate",
            quizDate
        );


        formData.append(
            "quizTime",
            quizTime
        );


        formData.append(
            "totalQuestions",
            "10"
        );


        for (let i = 1; i <= 10; i++) {

            formData.append(
                `question_${i}`,
                document.querySelector(
                    `[name="question_${i}"]`
                ).value.trim()
            );


            formData.append(
                `option_a_${i}`,
                document.querySelector(
                    `[name="option_a_${i}"]`
                ).value.trim()
            );


            formData.append(
                `option_b_${i}`,
                document.querySelector(
                    `[name="option_b_${i}"]`
                ).value.trim()
            );


            formData.append(
                `option_c_${i}`,
                document.querySelector(
                    `[name="option_c_${i}"]`
                ).value.trim()
            );


            formData.append(
                `option_d_${i}`,
                document.querySelector(
                    `[name="option_d_${i}"]`
                ).value.trim()
            );


            formData.append(
                `correct_answer_${i}`,
                document.querySelector(
                    `[name="correct_answer_${i}"]`
                ).value
            );

        }


        button.disabled = true;

        button.innerHTML = `
            <i data-lucide="loader-circle"
               class="w-5 h-5 animate-spin">
            </i>

            Creating Quiz...
        `;

        lucide.createIcons();


        try {

            const response =
                await fetch(
                    "/QuizRank/create-quiz",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        credentials:
                            "same-origin",

                        body:
                            formData
                    }
                );


            const data =
                await response.json();


            console.log(
                "Create quiz response:",
                data
            );


            if (!response.ok ||
                !data.success) {

                message.textContent =
                    data.message ||
                    "Server error. Please try again.";

                message.className =
                    "mt-4 text-sm text-red-600";


                button.disabled = false;

                button.innerHTML = `
                    <i data-lucide="plus-circle"
                       class="w-5 h-5">
                    </i>

                    Create Quiz
                `;

                lucide.createIcons();

                return;
            }


            message.textContent =
                "Quiz created successfully!";

            message.className =
                "mt-4 text-sm text-green-600";


            /*
             * Go back to My Course
             */

            setTimeout(() => {

                window.location.href =
                    "my-course.html";

            }, 1200);


        } catch (error) {

            console.error(error);


            message.textContent =
                "Server error. Please try again.";

            message.className =
                "mt-4 text-sm text-red-600";


            button.disabled = false;

            button.innerHTML = `
                <i data-lucide="plus-circle"
                   class="w-5 h-5">
                </i>

                Create Quiz
            `;

            lucide.createIcons();
        }

    });

</script>

</body>

</html>
