<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | QuizRank</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#4F46E5",
                        secondary: "#7C3AED"
                    }
                }
            }
        }
    </script>
</head>


<body class="min-h-screen bg-slate-50">

    <main class="min-h-screen flex items-center justify-center px-4 py-8">

        <div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden">

            <div class="grid md:grid-cols-2">

                <!-- =========================
                     LEFT SIDE
                ========================== -->

                <div
                    class="hidden md:flex relative bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-700 p-10 text-white">

                    <div class="relative z-10 flex flex-col justify-between w-full">

                        <!-- Logo -->

                        <div class="flex items-center gap-3">

                            <div
                                class="w-11 h-11 rounded-xl bg-white/15 border border-white/20 flex items-center justify-center">

                                <i data-lucide="layers" class="w-5 h-5"></i>

                            </div>

                            <div>

                                <h1 class="text-2xl font-bold">
                                    QuizRank
                                </h1>

                                <p class="text-xs text-indigo-200">
                                    Department Quiz Platform
                                </p>

                            </div>

                        </div>


                        <!-- Center Content -->

                        <div class="my-12">

                            <h2 class="text-4xl font-bold leading-tight">
                                Test your knowledge.
                            </h2>

                            <p class="mt-4 text-indigo-100 max-w-sm leading-7">
                                Practice, compete and track your progress.
                            </p>

                        </div>


                        <!-- Features -->

                        <div class="flex items-center gap-6 text-indigo-100 text-sm">

                            <div class="flex items-center gap-2">

                                <i data-lucide="book-open" class="w-4 h-4"></i>

                                <span>Courses</span>

                            </div>

                            <div class="flex items-center gap-2">

                                <i data-lucide="trophy" class="w-4 h-4"></i>

                                <span>Leaderboard</span>

                            </div>

                            <div class="flex items-center gap-2">

                                <i data-lucide="bar-chart-3" class="w-4 h-4"></i>

                                <span>Progress</span>

                            </div>

                        </div>

                    </div>


                    <!-- Decorative Circles -->

                    <div
                        class="absolute -right-20 -top-20 w-64 h-64 rounded-full bg-white/5">
                    </div>

                    <div
                        class="absolute -left-20 -bottom-24 w-72 h-72 rounded-full bg-purple-400/10">
                    </div>

                </div>



                <!-- =========================
                     RIGHT SIDE - LOGIN
                ========================== -->

                <div class="p-7 sm:p-10 md:p-12">

                    <!-- Mobile Logo -->

                    <div class="md:hidden flex justify-center mb-10">

                        <div class="flex items-center gap-3">

                            <div
                                class="w-11 h-11 rounded-xl bg-indigo-600 text-white flex items-center justify-center">

                                <i data-lucide="layers" class="w-5 h-5"></i>

                            </div>

                            <div>

                                <h1 class="text-2xl font-bold text-gray-900">
                                    QuizRank
                                </h1>

                                <p class="text-xs text-gray-500">
                                    Department Quiz Platform
                                </p>

                            </div>

                        </div>

                    </div>


                    <!-- Heading -->

                    <div class="mb-8">

                        <h2 class="text-3xl font-bold text-gray-900">
                            Welcome back
                        </h2>

                        <p class="text-gray-500 mt-2">
                            Sign in to continue.
                        </p>

                    </div>


                    <!-- Error -->

                    <div
                        id="errorMessage"
                        class="hidden mb-5 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-600">
                    </div>


                    <!-- Login Form -->

                    <form id="loginForm" class="space-y-5">

                        <!-- User ID -->

                        <div>

                            <label
                                for="userId"
                                class="block text-sm font-medium text-gray-700 mb-2">

                                Student / Teacher ID

                            </label>


                            <div class="relative">

                                <i
                                    data-lucide="user-round"
                                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400">
                                </i>


                                <input
                                    type="text"
                                    id="userId"
                                    name="userId"
                                    placeholder="Enter your ID"
                                    autocomplete="username"
                                    required
                                    class="w-full pl-12 pr-4 py-3.5 rounded-xl
                                    border border-gray-200
                                    bg-gray-50
                                    text-gray-900
                                    outline-none
                                    transition
                                    focus:bg-white
                                    focus:border-indigo-500
                                    focus:ring-4
                                    focus:ring-indigo-100">

                            </div>

                        </div>


                        <!-- Password -->

                        <div>

                            <div class="flex items-center justify-between mb-2">

                                <label
                                    for="password"
                                    class="block text-sm font-medium text-gray-700">

                                    Password

                                </label>


                                <button
                                    type="button"
                                    class="text-xs font-medium text-indigo-600 hover:text-indigo-700">

                                    Forgot password?

                                </button>

                            </div>


                            <div class="relative">

                                <i
                                    data-lucide="lock-keyhole"
                                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400">
                                </i>


                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                    class="w-full pl-12 pr-12 py-3.5 rounded-xl
                                    border border-gray-200
                                    bg-gray-50
                                    text-gray-900
                                    outline-none
                                    transition
                                    focus:bg-white
                                    focus:border-indigo-500
                                    focus:ring-4
                                    focus:ring-indigo-100">


                                <!-- Password Toggle -->

                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="absolute right-4 top-1/2
                                    -translate-y-1/2
                                    text-gray-400
                                    hover:text-gray-600">

                                    <i
                                        data-lucide="eye"
                                        id="eyeIcon"
                                        class="w-5 h-5">
                                    </i>

                                </button>

                            </div>

                        </div>


                        <!-- Remember Me -->

                        <div class="flex items-center gap-2">

                            <input
                                type="checkbox"
                                id="remember"
                                class="w-4 h-4 rounded border-gray-300
                                text-indigo-600
                                focus:ring-indigo-500">

                            <label
                                for="remember"
                                class="text-sm text-gray-600">

                                Remember me

                            </label>

                        </div>


                        <!-- Login Button -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="w-full py-3.5 px-5 rounded-xl
                            bg-indigo-600
                            hover:bg-indigo-700
                            active:bg-indigo-800
                            text-white
                            font-semibold
                            transition
                            duration-200
                            shadow-lg
                            shadow-indigo-200
                            flex items-center justify-center gap-2">

                            <i data-lucide="log-in" class="w-5 h-5"></i>

                            <span>Login</span>

                        </button>

                    </form>


                    <!-- Register -->

                    <div class="relative my-8">

                        <div class="absolute inset-0 flex items-center">

                            <div class="w-full border-t border-gray-200"></div>

                        </div>

                        <div class="relative flex justify-center">

                            <span class="bg-white px-4 text-sm text-gray-400">
                                New to QuizRank?
                            </span>

                        </div>

                    </div>


                    <a
                        href="register.html"
                        class="w-full py-3.5 px-5 rounded-xl
                        border border-gray-200
                        text-gray-700
                        font-semibold
                        hover:bg-gray-50
                        transition
                        flex items-center justify-center gap-2">

                        <i data-lucide="user-plus" class="w-5 h-5"></i>

                        Create an account

                    </a>


                    <!-- Footer -->

                    <p class="text-center text-xs text-gray-400 mt-8">
                        © 2026 QuizRank
                    </p>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // Initialize Lucide
        lucide.createIcons();


        // Elements

        const loginForm =
            document.getElementById("loginForm");

        const userIdInput =
            document.getElementById("userId");

        const passwordInput =
            document.getElementById("password");

        const errorMessage =
            document.getElementById("errorMessage");

        const togglePassword =
            document.getElementById("togglePassword");

        const eyeIcon =
            document.getElementById("eyeIcon");

        const loginButton =
            document.getElementById("loginButton");


        // =========================
        // SHOW / HIDE PASSWORD
        // =========================

        togglePassword.addEventListener("click", () => {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                eyeIcon.setAttribute(
                    "data-lucide",
                    "eye-off"
                );

            } else {

                passwordInput.type = "password";

                eyeIcon.setAttribute(
                    "data-lucide",
                    "eye"
                );

            }

            lucide.createIcons();

        });


        // =========================
        // LOGIN
        // =========================

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const userId =
                    userIdInput.value.trim();

                const password =
                    passwordInput.value;


                errorMessage.classList.add("hidden");
                errorMessage.textContent = "";


                // Validation

                if (!userId) {

                    showError(
                        "Please enter your ID."
                    );

                    return;
                }


                if (!password) {

                    showError(
                        "Please enter your password."
                    );

                    return;
                }


                // Loading

                loginButton.disabled = true;

                loginButton.classList.add(
                    "opacity-70",
                    "cursor-not-allowed"
                );

                loginButton.innerHTML = `
                    <i data-lucide="loader-circle"
                       class="w-5 h-5 animate-spin"></i>
                    <span>Signing in...</span>
                `;

                lucide.createIcons();


                try {

                    const response =
                        await fetch(
                            "/QuizRank/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded"
                                },

                                body:
                                    new URLSearchParams({
                                        userId: userId,
                                        password: password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "Login response:",
                        data
                    );


                    // =========================
                    // LOGIN SUCCESS
                    // =========================

                    if (data.success) {

                        /*
                         * Save logged-in user
                         * for dynamic dashboard
                         */

                        localStorage.setItem(
                            "user",
                            JSON.stringify(data.user)
                        );


                        // Student

                        if (
                            data.user.role ===
                            "STUDENT"
                        ) {

                            window.location.href =
                                "/QuizRank/Student/dashboard.html";

                        }


                        // Teacher

                        else if (
                            data.user.role ===
                            "TEACHER"
                        ) {

                            window.location.href =
                                "/QuizRank/teacher/dashboard.html";

                        }


                        else {

                            showError(
                                "Unknown user role."
                            );

                        }

                    }


                    // =========================
                    // LOGIN FAILED
                    // =========================

                    else {

                        showError(
                            data.message ||
                            "Invalid ID or password."
                        );

                    }


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showError(
                        "Server connection failed."
                    );

                }


                // Restore button

                loginButton.disabled = false;

                loginButton.classList.remove(
                    "opacity-70",
                    "cursor-not-allowed"
                );

                loginButton.innerHTML = `
                    <i data-lucide="log-in"
                       class="w-5 h-5"></i>
                    <span>Login</span>
                `;

                lucide.createIcons();

            }
        );


        // =========================
        // ERROR
        // =========================

        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.classList.remove(
                "hidden"
            );

        }

    </script>

</body>

</html>
